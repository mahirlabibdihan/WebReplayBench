[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "webreplaybench"
version = "0.1.0"
description = "A web app with database ground truth for every persistent change, and BrowserGym tasks on it"
requires-python = ">=3.10"
dependencies = ["browsergym-core", "playwright"]

[tool.setuptools]
packages = ["webreplaybench"]

[tool.setuptools.package-data]
webreplaybench = ["data/*.json", "data/scenarios/*.json"]
